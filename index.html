<style>
  :root{
    --bark:#4a3220; --bark2:#6b4a2c; --leaf:#3e7c3a; --leaf2:#57a04e;
    --paper:#faf6ef; --card:#ffffff; --line:#ddd2c0; --ink:#26221c;
    --muted:#7a7263; --red:#b3352b; --amber:#b97a12; --green:#2e7d32;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;}
  header{background:var(--bark);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  header .biz{font-size:13px;opacity:.85;letter-spacing:.4px;text-transform:uppercase;}
  header h1{margin:2px 0 0;font-size:22px;font-weight:800;}
  header h1 .accent{color:#a5d69e;}
  nav{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap;max-width:980px;margin:0 auto;}
  nav button{flex:1 1 auto;min-width:100px;padding:10px 8px;border:1px solid var(--line);background:#fff;border-radius:var(--radius) var(--radius) 0 0;border-bottom:none;font-size:14px;font-weight:600;cursor:pointer;color:var(--bark);}
  nav button.active{background:var(--leaf);color:#fff;border-color:var(--leaf);}
  main{max-width:980px;margin:0 auto;padding:14px 12px 60px;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .card h2{margin:0 0 10px;font-size:17px;color:var(--bark);}
  .card h3{margin:14px 0 8px;font-size:15px;color:var(--bark);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
  .stat .num{font-size:22px;font-weight:800;color:var(--bark);}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--bark);margin:8px 0 3px;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:52px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf2);border-color:var(--leaf2);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>div{flex:1 1 140px;}
  .btn{display:inline-block;padding:10px 16px;border:none;border-radius:8px;background:var(--leaf);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0;}
  .btn:hover{background:var(--leaf2);}
  .btn.secondary{background:#fff;color:var(--bark);border:1px solid var(--bark2);}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn.small{padding:6px 10px;font-size:13px;min-height:40px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  th{color:var(--bark);font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
  td.num,th.num{text-align:right;white-space:nowrap;}
  .totals{width:100%;max-width:420px;margin-left:auto;}
  .totals td{border-bottom:none;padding:3px 6px;}
  .totals .grand{font-size:17px;font-weight:800;color:var(--bark);border-top:2px solid var(--bark);}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}
  .pill.quoted{background:#7a7263;} .pill.scheduled{background:var(--amber);}
  .pill.done{background:var(--leaf);} .pill.paid{background:var(--green);} .pill.lost{background:var(--red);}
  .muted{color:var(--muted);font-size:13px;}
  .warn{background:#fdf3e0;border:1px solid var(--amber);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;}
  .stump-row{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#fffdf8;}
  .stump-row .row>div{flex:1 1 90px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--bark);margin-top:22px;}
  .chk input{width:18px;height:18px;}
  .job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .job-head .who{font-weight:800;font-size:16px;color:var(--bark);}
  details{margin-top:8px;}
  summary{cursor:pointer;font-weight:600;color:var(--leaf);font-size:13px;}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;}
  footer{max-width:980px;margin:0 auto;padding:0 12px 30px;color:var(--muted);font-size:12px;}
  @media (max-width:560px){
    header h1{font-size:19px;}
    nav button{min-width:0;font-size:13px;padding:9px 4px;}
    th,td{padding:6px 4px;font-size:13px;}
    .totals{max-width:none;}
  }
  #printArea{display:none;}
  @media print{
    body>*{display:none !important;}
    body>#printArea{display:block !important;font-size:13px;color:#000;background:#fff;padding:10px;}
    #printArea h1{font-size:20px;margin:0 0 2px;}
    #printArea table{width:100%;border-collapse:collapse;}
    #printArea th,#printArea td{border-bottom:1px solid #999;padding:5px 4px;text-align:left;}
    #printArea td.num,#printArea th.num{text-align:right;}
    #printArea .grand{font-weight:800;font-size:15px;}
  }
</style>

<script>
"use strict";
var LS_KEY = "stumpbook.v1";

function defaultSettings(){
  return {
    businessName: "My Stump Grinding",
    ownerName: "",
    phone: "",
    ratePerInch: 4.00,       // $ per diameter inch (trade range $2-$7)
    minCharge: 125,          // call-out minimum per job
    multiPct: 60,            // additional stumps billed at this % of their own per-inch price
    haulPerStump: 75,        // haul-away / debris removal adder per stump
    cleanupPerStump: 25,     // grindings cleanup / level & rake adder per stump
    fuelPerJob: 18,          // default fuel cost per job
    teethPerStump: 6,        // default teeth wear cost per stump
    disposalPerStump: 15,    // default disposal cost per hauled stump
    taxOn: false,
    taxRate: 0,
    quoteTerms: "Quote good for 30 days. Grinding depth approx. 6-8 inches below grade unless noted. Underground utilities are the property owner's responsibility to mark. Payment due on completion."
  };
}

function uid(){ return "j" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function num(x){ var n = parseFloat(x); return (isFinite(n) && !isNaN(n)) ? n : 0; }
function round2(n){ return Math.round((num(n) + Number.EPSILON) * 100) / 100; }
function money(n){ var v = round2(n); var sign = v < 0 ? "-" : ""; return sign + "$" + Math.abs(v).toFixed(2); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function todayStr(){ var d = new Date(); return d.toISOString().slice(0,10); }
function offsetDate(days){ var d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); }

/* ---------- Pricing engine (pure, hand-verifiable) ----------
   - Each stump's base = diameter inches x rate per inch.
   - The LARGEST stump bills at full rate ("first stump").
   - Every additional stump bills at multiPct % of its own base.
   - If the grinding subtotal is below the call-out minimum (and there is
     at least one stump), the grinding charge is the minimum.
   - Adders: haul-away and cleanup are per-stump opt-ins.
-------------------------------------------------------------- */
function stumpLinePrices(stumps, s){
  var order = stumps.map(function(st, i){ return i; });
  order.sort(function(a, b){
    var d = num(stumps[b].dia) - num(stumps[a].dia);
    return d !== 0 ? d : a - b;
  });
  var res = new Array(stumps.length);
  order.forEach(function(origIdx, rank){
    var base = round2(num(stumps[origIdx].dia) * num(s.ratePerInch));
    var factor = rank === 0 ? 1 : num(s.multiPct) / 100;
    res[origIdx] = { base: base, factor: factor, price: round2(base * factor) };
  });
  return res;
}

function quoteTotals(job, s){
  var stumps = job.stumps || [];
  var lines = stumpLinePrices(stumps, s);
  var grinding = round2(lines.reduce(function(a, l){ return a + l.price; }, 0));
  var minimumApplied = stumps.length > 0 && grinding < num(s.minCharge);
  var grindingCharge = stumps.length === 0 ? 0 : Math.max(grinding, num(s.minCharge));
  var haulCount = stumps.filter(function(st){ return !!st.haul; }).length;
  var cleanCount = stumps.filter(function(st){ return !!st.cleanup; }).length;
  var haulTotal = round2(haulCount * num(s.haulPerStump));
  var cleanTotal = round2(cleanCount * num(s.cleanupPerStump));
  var subtotal = round2(grindingCharge + haulTotal + cleanTotal);
  var tax = s.taxOn ? round2(subtotal * num(s.taxRate) / 100) : 0;
  var total = round2(subtotal + tax);
  return { lines: lines, grinding: grinding, grindingCharge: grindingCharge,
    minimumApplied: minimumApplied, haulCount: haulCount, cleanCount: cleanCount,
    haulTotal: haulTotal, cleanTotal: cleanTotal, subtotal: subtotal, tax: tax, total: total };
}

function defaultCosts(job, s){
  var haulCount = (job.stumps || []).filter(function(st){ return !!st.haul; }).length;
  return {
    fuel: num(s.fuelPerJob),
    teeth: round2(num(s.teethPerStump) * (job.stumps || []).length),
    disposal: round2(num(s.disposalPerStump) * haulCount),
    other: 0
  };
}
function costTotal(c){ c = c || {}; return round2(num(c.fuel) + num(c.teeth) + num(c.disposal) + num(c.other)); }
function jobProfit(job, s){
  var t = quoteTotals(job, s);
  var ct = costTotal(job.costs);
  return { total: t.total, costTotal: ct, profit: round2(t.total - ct) };
}
function jobBalance(job, s){
  var t = quoteTotals(job, s);
  return round2(t.total - num(job.deposit) - num(job.paid));
}

/* ---------- State ---------- */

function sanitizeStump(st){
  st = st || {};
  return {
    dia: Math.max(0, num(st.dia)),
    species: String(st.species == null ? "" : st.species).slice(0, 60),
    haul: !!st.haul,
    cleanup: !!st.cleanup,
    note: String(st.note == null ? "" : st.note).slice(0, 200)
  };
}
function sanitizeJob(j){
  j = j || {};
  var statuses = ["quoted","scheduled","done","paid","lost"];
  var c = j.costs || {};
  return {
    id: String(j.id || uid()),
    customer: String(j.customer == null ? "" : j.customer).slice(0, 120),
    phone: String(j.phone == null ? "" : j.phone).slice(0, 40),
    address: String(j.address == null ? "" : j.address).slice(0, 200),
    date: /^\d{4}-\d{2}-\d{2}$/.test(String(j.date || "")) ? String(j.date) : todayStr(),
    status: statuses.indexOf(j.status) >= 0 ? j.status : "quoted",
    deposit: Math.max(0, num(j.deposit)),
    paid: Math.max(0, num(j.paid)),
    notes: String(j.notes == null ? "" : j.notes).slice(0, 500),
    stumps: Array.isArray(j.stumps) ? j.stumps.slice(0, 200).map(sanitizeStump) : [],
    costs: { fuel: Math.max(0, num(c.fuel)), teeth: Math.max(0, num(c.teeth)),
             disposal: Math.max(0, num(c.disposal)), other: Math.max(0, num(c.other)) }
  };
}
function sanitizeState(raw){
  if (!raw || typeof raw !== "object") return null;
  var s = defaultSettings();
  var rs = raw.settings || {};
  Object.keys(s).forEach(function(k){
    if (rs[k] !== undefined) s[k] = rs[k];
  });
  ["ratePerInch","minCharge","haulPerStump","cleanupPerStump","fuelPerJob","teethPerStump","disposalPerStump","taxRate"].forEach(function(k){
    s[k] = Math.max(0, num(s[k]));
  });
  s.multiPct = Math.min(100, Math.max(0, num(s.multiPct)));
  s.taxOn = !!s.taxOn;
  ["businessName","ownerName","phone","quoteTerms"].forEach(function(k){ s[k] = String(s[k] == null ? "" : s[k]).slice(0, 500); });
  return { settings: s, jobs: Array.isArray(raw.jobs) ? raw.jobs.slice(0, 5000).map(sanitizeJob) : [], legal: sanitizeLegal(raw.legal) };
}

function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function load(){
  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  if (raw) {
    try { state = sanitizeState(JSON.parse(raw)); } catch(e){ state = null; }
  }
  if (!state) { state = seedState(); save(); }
}

/* ---------- Draft (quote builder) ---------- */
var draft = null;
function newDraft(){
  draft = { customer: "", phone: "", address: "", date: todayStr(), notes: "",
    stumps: [ { dia: 18, species: "", haul: false, cleanup: false, note: "" } ] };
}

/* ---------- Views ---------- */
var currentView = "dashboard";
function showView(v){
  currentView = v;
  ["dashboard","builder","jobs","settings","help"].forEach(function(name){
    document.getElementById("view-" + name).className = "view" + (name === v ? " active" : "");
    document.getElementById("tab-" + name).className = name === v ? "active" : "";
  });
  if (v === "dashboard") renderDashboard();
  if (v === "builder") renderBuilder();
  if (v === "jobs") renderJobs();
  if (v === "settings") renderSettings();
  if (v === "help") renderHelp();
  document.getElementById("hdrBiz").textContent = state.settings.businessName || "Stump Grinding";
}

function renderDashboard(){
  var s = state.settings;
  var quoted = 0, booked = 0, collected = 0, owed = 0, profitDone = 0, stumpCount = 0;
  state.jobs.forEach(function(j){
    var t = quoteTotals(j, s);
    stumpCount += j.stumps.length;
    if (j.status === "quoted") quoted += t.total;
    if (j.status === "scheduled" || j.status === "done" || j.status === "paid") booked += t.total;
    collected += num(j.deposit) + num(j.paid);
    if (j.status === "done") owed += Math.max(0, jobBalance(j, s));
    if (j.status === "done" || j.status === "paid") profitDone += jobProfit(j, s).profit;
  });
  var upcoming = state.jobs.filter(function(j){ return j.status === "scheduled"; })
    .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  var html = "";
  html += '<div class="grid">'
    + stat(booked, "Booked work") + stat(quoted, "Out in quotes")
    + stat(collected, "Collected") + stat(owed, "Owed on done jobs")
    + stat(profitDone, "Profit (done/paid)") + stat(stumpCount, "Stumps on the books")
    + "</div>";
  html += '<div class="card"><h2>Route — scheduled jobs</h2>';
  if (!upcoming.length) html += '<div class="empty">No scheduled jobs. Turn a quote into a route from the Job Book.</div>';
  upcoming.forEach(function(j){
    var t = quoteTotals(j, s);
    html += "<p><strong>" + esc(j.date) + " — " + esc(j.customer) + "</strong> · "
      + esc(j.address) + " · " + j.stumps.length + " stump" + (j.stumps.length === 1 ? "" : "s")
      + " · " + money(t.total) + (num(j.deposit) ? " · deposit " + money(j.deposit) : "") + "</p>";
  });
  html += '<button class="btn" onclick="showView(\'builder\')">+ New quote</button></div>';
  html += '<div class="card"><h2>How StumpBook prices</h2><p class="muted">Largest stump at your full per-inch rate ('
    + money(s.ratePerInch) + '/in), every additional stump at ' + esc(String(s.multiPct))
    + '% of its own per-inch price, ' + money(s.minCharge) + ' call-out minimum per job. Haul-away '
    + money(s.haulPerStump) + '/stump and cleanup ' + money(s.cleanupPerStump)
    + '/stump when you tick them. Change any of it in Settings.</p></div>';
  document.getElementById("view-dashboard").innerHTML = html;
}
function stat(v, lbl){ return '<div class="stat"><div class="num">' + money(v) + '</div><div class="lbl">' + lbl + "</div></div>"; }

function draftTotals(){ return quoteTotals({ stumps: draft.stumps }, state.settings); }

function renderBuilder(){
  var s = state.settings;
  var html = '<div class="card"><h2>New quote</h2>';
  html += '<div class="row"><div><label>Customer name</label><input type="text" id="d-customer" value="' + esc(draft.customer) + '" oninput="draft.customer=this.value"></div>'
    + '<div><label>Phone</label><input type="tel" id="d-phone" value="' + esc(draft.phone) + '" oninput="draft.phone=this.value"></div></div>';
  html += '<div class="row"><div><label>Address / location</label><input type="text" id="d-address" value="' + esc(draft.address) + '" oninput="draft.address=this.value"></div>'
    + '<div><label>Job date</label><input type="date" id="d-date" value="' + esc(draft.date) + '" onchange="draft.date=this.value"></div></div>';
  html += '<label>Job notes (access, utilities, gates)</label><textarea id="d-notes" oninput="draft.notes=this.value">' + esc(draft.notes) + "</textarea>";
  html += "<h3>Stumps</h3><div id='d-stumps'>";
  draft.stumps.forEach(function(st, i){
    html += '<div class="stump-row"><div class="row">'
      + '<div><label>Diameter (inches)</label><input inputmode="decimal" type="number" min="0" step="0.5" value="' + esc(String(st.dia)) + '" oninput="draftStump(' + i + ',\'dia\',this.value)"></div>'
      + '<div><label>Species</label><input type="text" value="' + esc(st.species) + '" oninput="draftStump(' + i + ',\'species\',this.value)"></div>'
      + '<div><label class="chk"><input type="checkbox" ' + (st.haul ? "checked" : "") + ' onchange="draftStump(' + i + ',\'haul\',this.checked)"> Haul away (+' + money(s.haulPerStump) + ")</label></div>"
      + '<div><label class="chk"><input type="checkbox" ' + (st.cleanup ? "checked" : "") + ' onchange="draftStump(' + i + ',\'cleanup\',this.checked)"> Cleanup (+' + money(s.cleanupPerStump) + ")</label></div>"
      + "</div>"
      + '<label>Note</label><input type="text" value="' + esc(st.note) + '" oninput="draftStump(' + i + ',\'note\',this.value)">'
      + '<div style="margin-top:6px"><span class="muted" id="d-line-' + i + '"></span> '
      + '<button class="btn danger small" onclick="removeStump(' + i + ')">Remove stump</button></div></div>';
  });
  html += "</div>";
  html += '<button class="btn secondary" onclick="addStump()">+ Add stump</button>';
  html += '<div id="d-totals"></div>';
  html += '<div style="margin-top:10px"><button class="btn" onclick="saveDraft()">Save quote to Job Book</button></div>';
  html += "</div>";
  document.getElementById("view-builder").innerHTML = html;
  refreshBuilderTotals();
}
function draftStump(i, field, value){
  if (field === "dia") draft.stumps[i].dia = Math.max(0, num(value));
  else draft.stumps[i][field] = value;
  refreshBuilderTotals();
}
function addStump(){ draft.stumps.push({ dia: 14, species: "", haul: false, cleanup: false, note: "" }); renderBuilder(); }
function removeStump(i){ draft.stumps.splice(i, 1); if (!draft.stumps.length) draft.stumps.push({ dia: 0, species: "", haul: false, cleanup: false, note: "" }); renderBuilder(); }

function gv(id){ var el = document.getElementById(id); return el ? el.value : ""; }
function gc(id){ var el = document.getElementById(id); return el ? !!el.checked : false; }
function saveSettings(){
  var s = state.settings;
  s.businessName = gv("s-biz").slice(0, 120) || s.businessName;
  s.phone = gv("s-phone").slice(0, 40);
  s.ratePerInch = Math.max(0, num(gv("s-rate")));
  s.minCharge = Math.max(0, num(gv("s-min")));
  s.multiPct = Math.min(100, Math.max(0, num(gv("s-multi"))));
  s.haulPerStump = Math.max(0, num(gv("s-haul")));
  s.cleanupPerStump = Math.max(0, num(gv("s-clean")));
  s.fuelPerJob = Math.max(0, num(gv("s-fuel")));
  s.teethPerStump = Math.max(0, num(gv("s-teeth")));
  s.disposalPerStump = Math.max(0, num(gv("s-disp")));
  s.taxOn = gc("s-taxon");
  s.taxRate = Math.max(0, num(gv("s-taxrate")));
  s.quoteTerms = gv("s-terms").slice(0, 500);
  save(); showView("settings");
  alert("Settings saved.");
}
function clearDemo(){ if (confirm("Delete ALL jobs? Export a backup first if you need them.")) { state.jobs = []; save(); showView("dashboard"); } }
function exportData(){
  var payload = JSON.stringify({ app: "stumpbook", version: 1, settings: state.settings, jobs: state.jobs }, null, 2);
  try {
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "stumpbook-backup.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch(e){ alert("Export not supported in this browser."); }
}
function importData(input){
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var parsed = JSON.parse(String(reader.result));
      if (!parsed || parsed.app !== "stumpbook") { alert("That file is not a StumpBook backup."); return; }
      var clean = sanitizeState(parsed);
      if (!clean) { alert("That backup could not be read."); return; }
      state = clean; save(); newDraft(); showView("dashboard");
      alert("Backup imported: " + state.jobs.length + " jobs.");
    } catch(e){ alert("That file could not be imported — it is not valid backup data."); }
  };
  reader.readAsText(file);
}

function sanitizeLegal(v){

}

function legalVersionCmp(a, b){
